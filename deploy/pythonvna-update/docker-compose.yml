services:
  pythonvna-update:
    image: nginx:1.27-alpine
    container_name: pythonvna-update
    restart: unless-stopped
    depends_on:
      - pythonvna-publisher
    ports:
      - "127.0.0.1:8095:80"
    volumes:
      - /volume1/docker/pythonvna-update/www:/usr/share/nginx/html:ro
      - /volume1/docker/pythonvna-update/nginx.conf:/etc/nginx/conf.d/default.conf:ro

  pythonvna-publisher:
    image: python:3.13-alpine
    container_name: pythonvna-publisher
    restart: unless-stopped
    user: "1000:1000"
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    env_file:
      - /volume1/docker/pythonvna-update/publisher.env
    environment:
      PYTHONVNA_PUBLISH_ROOT: /data
      PYTHONVNA_MAX_UPLOAD_BYTES: "314572800"
      PYTHONVNA_KEEP_FULL_RELEASES: "2"
    command: ["python", "/app/publisher.py"]
    volumes:
      - /volume1/docker/pythonvna-update/publisher.py:/app/publisher.py:ro
      - /volume1/docker/pythonvna-update/www/pythonvna:/data:rw
    tmpfs:
      - /tmp:size=16m,mode=1777
