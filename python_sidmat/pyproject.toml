[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "python-sidmat"
version = "0.1.4"
description = "Vendor-free SiDiMaT measurement software for IDE TC-MFD / OPTICON (pure RCI serial + Welch TF estimation)."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }
authors = [{ name = "python_sidmat" }]
dependencies = [
  "numpy>=1.24",
  "pyserial>=3.5",
  "python-samba>=0.1.4",
]

[project.optional-dependencies]
gui = ["PySide6>=6.6", "pyqtgraph>=0.13"]
dev = ["pytest>=8.0"]

[project.scripts]
python-sidmat = "python_sidmat.cli:main"
python-sidmat-gui = "python_sidmat.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
