[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "python-samba"
version = "0.1.4"
description = "Vendor-free host software for IDE TC-MFD / OPTICON active vibration isolation (pure RCI serial)."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }
authors = [{ name = "python_samba" }]
dependencies = [
  "pyserial>=3.5",
  "psutil>=5.9",
]

[project.optional-dependencies]
gui = [
  "PySide6>=6.6",
  "numpy>=1.26",
  "pyqtgraph>=0.13",
]
dev = ["pytest>=8.0"]
build = [
  "PySide6>=6.6",
  "numpy>=1.26",
  "pyqtgraph>=0.13",
  "pyinstaller>=6.0",
]

[project.scripts]
python-samba = "python_samba.cli:main"
python-samba-gui = "python_samba.app:main"
python-samba-comm-server = "python_samba.commserver.cli:main"
python-samba-comm-server-gui = "python_samba.commserver.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.data-files]
python_samba_patches = ["_patches/*.py"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
