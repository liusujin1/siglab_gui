[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "python-samba"
version = "0.1.0"
description = "Vendor-free host software for IDE TC-MFD / OPTICON active vibration isolation (pure RCI serial)."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }
authors = [{ name = "python_samba" }]
dependencies = [
  "pyserial>=3.5",
]

[project.optional-dependencies]
gui = ["PySide6>=6.6"]
dev = ["pytest>=8.0"]

[project.scripts]
python-samba = "python_samba.cli:main"
python-samba-gui = "python_samba.app:main"
python-samba-comm-server = "python_samba.commserver.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.data-files]
python_samba_patches = ["_patches/*.py"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
